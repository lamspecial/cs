<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shabih — Edit Deck</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #181c2e;
    --bg-panel: #1e2338;
    --bg-card: #252b42;
    --bg-input: #2a3150;
    --border: rgba(255,255,255,0.08);
    --border-focus: rgba(232,201,122,0.5);
    --accent: #ffffff;
    --accent-soft: rgba(255,255,255,0.65);
    --accent-muted: rgba(255,255,255,0.3);
    --gold: #e8c97a;
    --gold-soft: rgba(232,201,122,0.12);
    --brand: #3d4fc7;
    --green: #6ee7a0;
    --red: #f87171;
    --transition: 200ms ease;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--accent);
  }

  /* ─── LAYOUT ─── */
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 28px 0; position: sticky; top: 0;
    height: 100vh; overflow-y: auto;
  }
  .sidebar-logo {
    padding: 0 24px 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .sidebar-logo-text {
    font-family: 'DM Serif Display', serif;
    font-size: 24px; color: var(--accent);
  }
  .sidebar-logo-sub {
    font-size: 11px; color: var(--accent-muted);
    margin-top: 3px; letter-spacing: 0.06em;
  }

  .slide-nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 24px; cursor: pointer;
    transition: background var(--transition), color var(--transition);
    border-radius: 0;
  }
  .slide-nav-item:hover { background: var(--bg-card); }
  .slide-nav-item.active { background: var(--gold-soft); }
  .slide-nav-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--bg-card); display: flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 600;
    color: var(--accent-muted); flex-shrink: 0;
    transition: background var(--transition), color var(--transition);
  }
  .slide-nav-item.active .slide-nav-num {
    background: var(--gold); color: #1a1a1a;
  }
  .slide-nav-label {
    font-size: 13px; color: var(--accent-soft);
    font-weight: 400;
  }
  .slide-nav-item.active .slide-nav-label {
    color: var(--gold); font-weight: 500;
  }

  .sidebar-actions {
    margin-top: auto; padding: 20px 24px;
    border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 10px 18px; border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500; cursor: pointer;
    border: none; transition: all var(--transition); text-decoration: none;
    letter-spacing: 0.02em;
  }
  .btn-gold {
    background: var(--gold); color: #1a1a1a;
  }
  .btn-gold:hover { background: #f0d48a; }
  .btn-outline {
    background: transparent; color: var(--accent-soft);
    border: 1px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--accent-muted); color: var(--accent); }
  .btn-brand {
    background: var(--brand); color: white;
  }
  .btn-brand:hover { background: #4a5cdb; }
  .btn-green {
    background: rgba(110,231,160,0.15); color: var(--green);
    border: 1px solid rgba(110,231,160,0.25);
  }
  .btn-green:hover { background: rgba(110,231,160,0.25); }

  /* ─── MAIN EDITOR ─── */
  .editor-main {
    padding: 48px 56px;
    max-width: 900px;
  }

  .editor-header {
    margin-bottom: 36px;
  }
  .editor-slide-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 8px;
  }
  .editor-slide-title {
    font-family: 'DM Serif Display', serif;
    font-size: 28px; color: var(--accent);
  }

  .field-group {
    margin-bottom: 28px;
  }
  .field-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent-muted);
    margin-bottom: 8px; display: block;
  }
  textarea, input[type="text"] {
    width: 100%; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; color: var(--accent);
    font-family: 'DM Sans', sans-serif; font-size: 14px;
    line-height: 1.6; resize: vertical;
    transition: border-color var(--transition);
    outline: none;
  }
  textarea:focus, input[type="text"]:focus {
    border-color: var(--border-focus);
  }
  textarea { min-height: 80px; }

  .bullets-section { margin-bottom: 28px; }
  .bullet-row {
    display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start;
  }
  .bullet-index {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--gold); color: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; flex-shrink: 0; margin-top: 12px;
  }
  .bullet-row textarea { min-height: 60px; }

  .divider-line {
    border: none; border-top: 1px solid var(--border);
    margin: 32px 0;
  }

  /* ─── TRANSLATE PANEL ─── */
  .translate-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 32px;
  }
  .translate-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .translate-title {
    font-size: 14px; font-weight: 600; color: var(--gold);
    letter-spacing: 0.04em;
  }
  .translate-controls {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  select {
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; color: var(--accent);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; outline: none;
  }
  select:focus { border-color: var(--border-focus); }

  .translate-output {
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px;
    min-height: 100px; font-size: 13px; color: var(--accent-soft);
    line-height: 1.7; white-space: pre-wrap;
    direction: auto;
  }
  .translate-status {
    font-size: 12px; color: var(--accent-muted); margin-top: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-muted);
  }
  .status-dot.active { background: var(--green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ─── TOAST ─── */
  #toast {
    position: fixed; bottom: 28px; right: 28px;
    background: var(--green); color: #1a1a1a;
    padding: 12px 20px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    opacity: 0; transform: translateY(10px);
    transition: all 300ms ease; pointer-events: none;
    z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  /* ─── TOP BAR ─── */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 40px; padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .top-bar-title {
    font-size: 13px; color: var(--accent-muted); letter-spacing: 0.06em;
  }

  /* Loading spinner */
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--accent-muted);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 20px;
    background: var(--gold-soft); color: var(--gold);
  }
</style>
</head>
<body>

<div id="toast">Saved</div>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-text">Shabih</div>
      <div class="sidebar-logo-sub">Deck Editor</div>
    </div>

    <nav id="slide-nav"></nav>

    <div class="sidebar-actions">
      <button class="btn btn-gold" onclick="saveAll()">Save All Changes</button>
      <a href="index.html" class="btn btn-brand">View Presentation</a>
      <button class="btn btn-outline" onclick="resetAll()">Reset to Defaults</button>
    </div>
  </aside>

  <!-- MAIN EDITOR -->
  <main class="editor-main">
    <div class="top-bar">
      <span class="top-bar-title">Editing slide content — changes are saved to your browser</span>
      <span class="badge">Local Storage</span>
    </div>

    <!-- TRANSLATE PANEL -->
    <div class="translate-panel">
      <div class="translate-header">
        <span class="translate-title">Translation Assistant</span>
        <button class="btn btn-green" id="translateBtn" onclick="translateCurrentSlide()">Translate This Slide</button>
      </div>
      <div class="translate-controls">
        <label style="font-size:12px;color:var(--accent-muted);letter-spacing:0.06em;text-transform:uppercase">Translate to:</label>
        <select id="targetLang">
          <option value="Arabic">Arabic (العربية)</option>
          <option value="English">English</option>
          <option value="French">French</option>
          <option value="Spanish">Spanish</option>
          <option value="German">German</option>
          <option value="Chinese (Simplified)">Chinese (Simplified)</option>
          <option value="Japanese">Japanese</option>
          <option value="Korean">Korean</option>
          <option value="Turkish">Turkish</option>
          <option value="Urdu">Urdu</option>
        </select>
        <label style="font-size:12px;color:var(--accent-muted);letter-spacing:0.06em;text-transform:uppercase">Style:</label>
        <select id="transStyle">
          <option value="formal investor presentation">Formal (Investor)</option>
          <option value="conversational">Conversational</option>
          <option value="concise">Concise</option>
        </select>
      </div>
      <div class="translate-output" id="translateOutput">Translation will appear here. Select a target language and click "Translate This Slide".</div>
      <div class="translate-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Ready</span>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-outline" onclick="copyTranslation()" style="font-size:12px;padding:8px 14px">Copy Translation</button>
        <button class="btn btn-outline" onclick="applyTranslation()" style="font-size:12px;padding:8px 14px">Apply to Fields</button>
      </div>
    </div>

    <!-- DYNAMIC SLIDE EDITOR -->
    <div id="slide-editor"></div>

    <div style="display:flex;gap:12px;margin-top:36px">
      <button class="btn btn-gold" onclick="saveAll()">Save All Changes</button>
      <button class="btn btn-outline" onclick="navigateSlide(-1)">Previous Slide</button>
      <button class="btn btn-outline" onclick="navigateSlide(1)">Next Slide</button>
    </div>
  </main>
</div>

<script>
// ─── SLIDE DATA ───
const SLIDES = [
  {
    id: 0, label: '00 — Cover', title: 'Cover Slide',
    fields: [
      { key: 'headline', label: 'Main Title', type: 'input', default: 'Shabih' },
      { key: 'sub', label: 'Tagline', type: 'input', default: 'The referral marketplace where every customer is proof of performance.' },
    ],
    bullets: []
  },
  {
    id: 1, label: '01 — Problem', title: 'Problem',
    fields: [
      { key: 'headline', label: 'Slide Headline', type: 'textarea', default: 'Marketing spend in Saudi Arabia is largely unaccountable, and the people best placed to sell are locked out of earning.' }
    ],
    bullets: [
      'Saudi Arabia has one of the world\'s highest social media penetration rates, yet businesses pay for impressions with no guarantee of a real customer walking through the door.',
      'Over 700,000 registered SMEs operate in the Kingdom — the majority rely on word-of-mouth but have no structured way to reward it or measure its impact.',
      'Millions of everyday social media users have engaged, loyal audiences but no accessible path to monetize their influence without being a "verified" macro-influencer.',
      'Consumers distrust digital ads; they trust recommendations from people they follow. There is no platform that converts that trust into a verified, measurable commercial transaction.'
    ]
  },
  {
    id: 2, label: '02 — Solution', title: 'Solution & Product',
    fields: [
      { key: 'headline', label: 'Slide Headline', type: 'textarea', default: 'Shabih closes the loop: verified in-store referrals, powered by micro-ambassadors, settled in an internal economy.' }
    ],
    bullets: [
      'Physical QR verification eliminates fraud — every credit earned corresponds to a real customer visit.',
      'No follower minimum required — the platform aggregates thousands of micro-audiences into collective commercial scale.',
      'Internal credits are spendable across the partner ecosystem, creating a closed-loop economy that retains value on platform.'
    ]
  },
  {
    id: 3, label: '03 — Market', title: 'Market Size',
    fields: [
      { key: 'headline', label: 'Slide Headline', type: 'textarea', default: 'A large, underpenetrated market at the intersection of social commerce, affiliate marketing, and physical retail.' }
    ],
    bullets: [
      'Saudi Arabia ranks among the top 10 countries globally for social media usage per capita — with TikTok and Snapchat penetration above 80% among 18–34 year olds.',
      'Vision 2030 SME development targets create regulatory tailwind: the Kingdom aims for SMEs to contribute 35% of GDP by 2030, requiring efficient marketing infrastructure.',
      'GCC expansion (UAE, Kuwait, Bahrain) replicates the model into adjacent markets with similar social behavior and SME density. All figures marked as estimates.'
    ]
  },
  {
    id: 4, label: '04 — Business Model', title: 'Business Model',
    fields: [
      { key: 'headline', label: 'Slide Headline', type: 'textarea', default: 'Three revenue streams that scale with transaction volume, not headcount.' }
    ],
    bullets: [
      'Worked example: 1,000 Shabeehs, 10 referrals each/month = 10,000 verified visits. Platform earns 100,000 credits in spread. At a 1 SAR/credit rate, that is 100,000 SAR monthly from referral spread alone.',
      'Internal spending generates a second layer — 70% of credits spent internally doubles the spread per credit unit before it leaves the system.',
      'Margin is embedded in every transaction; no ad budget required to grow revenue.'
    ]
  },
  {
    id: 5, label: '05 — Competitors', title: 'Competitive Landscape',
    fields: [
      { key: 'headline', label: 'Slide Headline', type: 'textarea', default: 'No existing platform combines physical verification, micro-audience aggregation, and an internal economy in one product.' }
    ],
    bullets: []
  },
  {
    id: 6, label: '06 — Traction', title: 'Traction',
    fields: [
      { key: 'headline', label: 'Slide Headline', type: 'textarea', default: 'Pre-launch — validated by market research, system architecture complete, and early partnerships in motion.' }
    ],
    bullets: [
      'Market research completed: consumer trust behavior in social referrals studied across Riyadh, Jeddah, and Khobar.',
      'Full system architecture designed covering platform, Shabeeh app, branch terminal, and credit ledger.',
      'Application submitted to 500 Global accelerator program; founding business partnerships in active discussion.',
      'Pre-launch positioning: all figures above reflect current pipeline conversations, not live transactions.'
    ]
  },
  {
    id: 7, label: '07 — Growth Strategy', title: 'Growth Strategy',
    fields: [
      { key: 'headline', label: 'Slide Headline', type: 'textarea', default: 'Growth is driven by ambassador activity — not paid acquisition. Every Shabeeh is a distribution node.' }
    ],
    bullets: [
      'Phase 1 — Prove the Loop (Months 1–6): Single district in Riyadh. Anchor in food, beauty, and wellness. Onboard 20–30 businesses and 500 Shabeehs. Measure referral-to-visit conversion rate and credit retention. Iterate product.',
      'Phase 2 — Flywheel (Months 7–18): Expand to multiple Riyadh districts, then Jeddah and Dammam. Shabeehs recruit other Shabeehs through referral incentives. Growth becomes self-reinforcing — businesses join because Shabeehs are there; Shabeehs join because businesses are there.',
      'Phase 3 — Open Platform (Month 19+): Expand across all business categories. Introduce tiered Shabeeh ranking system with status rewards. Launch GCC expansion starting with UAE. Explore B2B licensing of the verification infrastructure.'
    ]
  },
  {
    id: 8, label: '08 — Team', title: 'Team',
    fields: [
      { key: 'headline', label: 'Slide Headline', type: 'textarea', default: 'A focused founding team with the local knowledge and technical capability to build and scale Shabih.' },
      { key: 'ceo_name', label: 'CEO Name', type: 'input', default: '[Name]' },
      { key: 'ceo_desc', label: 'CEO Description', type: 'textarea', default: 'Product strategy and business development. Deep understanding of Saudi SME landscape and consumer behavior.' },
      { key: 'cto_name', label: 'CTO Name', type: 'input', default: '[Name]' },
      { key: 'cto_desc', label: 'CTO Description', type: 'textarea', default: 'Platform architecture and technical execution. Responsible for the QR verification system, ambassador app, and credit ledger.' },
      { key: 'advisor_name', label: 'Advisor Name', type: 'input', default: '[Name]' },
      { key: 'advisor_desc', label: 'Advisor Description', type: 'textarea', default: '[Area of expertise — e.g., MENA venture, retail operations, fintech]' },
    ],
    bullets: [
      'Early-stage team is expected to be lean. The founding pair covers the two critical competencies: market access and product execution.',
      'First hires post-funding: Head of Business Partnerships and a mobile developer to accelerate the Shabeeh app build.'
    ]
  },
  {
    id: 9, label: '09 — Financials', title: 'Financial Projections',
    fields: [
      { key: 'headline', label: 'Slide Headline', type: 'textarea', default: 'Revenue scales with the number of active Shabeehs — three scenarios, all projections.' }
    ],
    bullets: []
  },
  {
    id: 10, label: '10 — The Ask', title: 'The Ask',
    fields: [
      { key: 'headline', label: 'Slide Headline', type: 'textarea', default: 'We are raising [X SAR / USD] to prove the referral loop at scale and reach [X] verified transactions within 12 months.' }
    ],
    bullets: [
      'Milestone: complete platform build, onboard [X] businesses, activate [X] Shabeehs, and record first [X] verified referral transactions — all within 12 months of closing.',
      'This round positions Shabih for a Series A raise with live data, unit economics, and a replicable city-rollout playbook.'
    ]
  }
];

let currentSlide = 0;
let lastTranslation = '';

// ─── BUILD SIDEBAR NAV ───
function buildNav() {
  const nav = document.getElementById('slide-nav');
  nav.innerHTML = SLIDES.map((s, i) => `
    <div class="slide-nav-item ${i === currentSlide ? 'active' : ''}" onclick="goToSlide(${i})">
      <div class="slide-nav-num">${s.id}</div>
      <div class="slide-nav-label">${s.title}</div>
    </div>
  `).join('');
}

// ─── BUILD EDITOR ───
function buildEditor() {
  const s = SLIDES[currentSlide];
  const stored = getStored(currentSlide);
  const editor = document.getElementById('slide-editor');

  let html = `
    <div class="editor-header">
      <div class="editor-slide-label">${s.label}</div>
      <div class="editor-slide-title">${s.title}</div>
    </div>
  `;

  // Fields
  s.fields.forEach(f => {
    const val = stored[f.key] !== undefined ? stored[f.key] : f.default;
    html += `<div class="field-group">
      <label class="field-label">${f.label}</label>
      ${f.type === 'textarea'
        ? `<textarea id="field_${f.key}" rows="3">${escHtml(val)}</textarea>`
        : `<input type="text" id="field_${f.key}" value="${escHtml(val)}">`
      }
    </div>`;
  });

  // Bullets
  if (s.bullets && s.bullets.length > 0) {
    html += `<div class="bullets-section">
      <label class="field-label">Bullet Points</label>`;
    s.bullets.forEach((b, i) => {
      const val = stored.bullets && stored.bullets[i] !== undefined ? stored.bullets[i] : b;
      html += `<div class="bullet-row">
        <div class="bullet-index">${i + 1}</div>
        <textarea id="bullet_${i}" rows="2">${escHtml(val)}</textarea>
      </div>`;
    });
    html += `</div>`;
  }

  editor.innerHTML = html;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ─── STORAGE ───
function getStored(idx) {
  const raw = localStorage.getItem('shabih_slide_' + idx);
  try { return raw ? JSON.parse(raw) : {}; } catch(e) { return {}; }
}

function saveAll() {
  const s = SLIDES[currentSlide];
  const data = {};
  s.fields.forEach(f => {
    const el = document.getElementById('field_' + f.key);
    if (el) data[f.key] = el.value;
  });
  if (s.bullets && s.bullets.length > 0) {
    data.bullets = s.bullets.map((_, i) => {
      const el = document.getElementById('bullet_' + i);
      return el ? el.value : s.bullets[i];
    });
  }
  localStorage.setItem('shabih_slide_' + currentSlide, JSON.stringify(data));
  showToast('Saved');
}

function resetAll() {
  if (!confirm('Reset this slide to default content?')) return;
  localStorage.removeItem('shabih_slide_' + currentSlide);
  buildEditor();
  showToast('Reset');
}

// ─── NAVIGATION ───
function goToSlide(idx) {
  saveAll();
  currentSlide = idx;
  buildNav();
  buildEditor();
  document.querySelector('.editor-main').scrollTo(0, 0);
}

function navigateSlide(dir) {
  const next = currentSlide + dir;
  if (next < 0 || next >= SLIDES.length) return;
  goToSlide(next);
}

// ─── TRANSLATE ───
async function translateCurrentSlide() {
  const btn = document.getElementById('translateBtn');
  const output = document.getElementById('translateOutput');
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const lang = document.getElementById('targetLang').value;
  const style = document.getElementById('transStyle').value;
  const s = SLIDES[currentSlide];

  // Gather current content
  let content = '';
  s.fields.forEach(f => {
    const el = document.getElementById('field_' + f.key);
    if (el) content += f.label + ':\n' + el.value + '\n\n';
  });
  if (s.bullets && s.bullets.length > 0) {
    content += 'Bullet Points:\n';
    s.bullets.forEach((_, i) => {
      const el = document.getElementById('bullet_' + i);
      if (el) content += (i + 1) + '. ' + el.value + '\n';
    });
  }

  if (!content.trim()) {
    output.textContent = 'No content to translate on this slide.';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Translating...';
  dot.className = 'status-dot active';
  statusText.textContent = 'Translating via Claude API...';
  output.textContent = 'Working...';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `Translate the following investor pitch deck slide content into ${lang}. Use a ${style} tone. Maintain the same structure (label names in the source language are fine to keep, but translate all content values). Output only the translated content, preserving the label structure.\n\n${content}`
        }]
      })
    });

    const data = await response.json();
    const translated = data.content && data.content[0] && data.content[0].text
      ? data.content[0].text
      : 'Translation failed. Please try again.';

    lastTranslation = translated;
    output.textContent = translated;
    dot.className = 'status-dot';
    statusText.textContent = 'Translation complete';
  } catch (err) {
    output.textContent = 'Error: ' + err.message;
    dot.className = 'status-dot';
    statusText.textContent = 'Error occurred';
  }

  btn.disabled = false;
  btn.textContent = 'Translate This Slide';
}

function copyTranslation() {
  if (!lastTranslation) return;
  navigator.clipboard.writeText(lastTranslation).then(() => showToast('Copied'));
}

function applyTranslation() {
  if (!lastTranslation) return;
  // Try to parse and apply line by line
  const lines = lastTranslation.split('\n');
  const s = SLIDES[currentSlide];
  let bulletIdx = 0;
  let inBullets = false;

  lines.forEach(line => {
    // Check for headline patterns
    s.fields.forEach(f => {
      if (line.toLowerCase().includes(f.label.toLowerCase() + ':')) {
        const val = line.split(':').slice(1).join(':').trim();
        if (val) {
          const el = document.getElementById('field_' + f.key);
          if (el) el.value = val;
        }
      }
    });
    // Check for bullets (numbered lines)
    const bulletMatch = line.match(/^(\d+)\.\s+(.+)/);
    if (bulletMatch) {
      const i = parseInt(bulletMatch[1]) - 1;
      const el = document.getElementById('bullet_' + i);
      if (el) el.value = bulletMatch[2];
    }
  });
  showToast('Applied translation');
}

// ─── TOAST ───
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ─── INIT ───
buildNav();
buildEditor();
</script>
