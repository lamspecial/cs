<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شبيح — تعديل العرض</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display:ital@0;1&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #2d3baa;
    --bg: #3d4fc7;
    --bg-card: rgba(255,255,255,0.08);
    --bg-input: rgba(255,255,255,0.07);
    --bg-input-focus: rgba(255,255,255,0.12);
    --border: rgba(255,255,255,0.12);
    --border-focus: rgba(232,201,122,0.6);
    --accent: #ffffff;
    --accent-soft: rgba(255,255,255,0.7);
    --accent-muted: rgba(255,255,255,0.35);
    --accent-faint: rgba(255,255,255,0.12);
    --gold: #e8c97a;
    --gold-soft: rgba(232,201,122,0.15);
    --green: #6ee7a0;
    --green-soft: rgba(110,231,160,0.15);
    --transition: 200ms ease;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    background: var(--bg-deep);
    font-family: 'Tajawal', 'DM Sans', sans-serif;
    color: var(--accent);
    direction: rtl;
  }

  /* ─── WAVE BACKGROUND (fixed, behind everything) ─── */
  #global-waves {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }

  /* ─── LAYOUT ─── */
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
    position: relative; z-index: 1;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    background: rgba(30,35,80,0.85);
    backdrop-filter: blur(12px);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 0; position: sticky; top: 0;
    height: 100vh; overflow-y: auto;
  }
  .sidebar-logo {
    padding: 28px 20px 22px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo-text {
    font-family: 'DM Serif Display', serif;
    font-size: 22px; color: var(--accent); direction: ltr; text-align: right;
  }
  .sidebar-logo-sub {
    font-size: 12px; color: var(--accent-muted);
    margin-top: 4px; font-weight: 300;
  }

  .slide-nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 20px; cursor: pointer;
    transition: background var(--transition);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .slide-nav-item:hover { background: rgba(255,255,255,0.06); }
  .slide-nav-item.active { background: var(--gold-soft); }
  .slide-nav-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: var(--accent-muted);
    flex-shrink: 0; transition: all var(--transition);
    font-family: 'DM Sans', sans-serif;
  }
  .slide-nav-item.active .slide-nav-num { background: var(--gold); color: #1a1a1a; }
  .slide-nav-label { font-size: 13px; color: var(--accent-soft); font-weight: 400; }
  .slide-nav-item.active .slide-nav-label { color: var(--gold); font-weight: 500; }

  .sidebar-actions {
    margin-top: auto; padding: 18px 20px;
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
  }

  /* ─── BUTTONS ─── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 10px 18px; border-radius: 8px;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px; font-weight: 500; cursor: pointer;
    border: none; transition: all var(--transition); text-decoration: none;
    width: 100%;
  }
  .btn-gold { background: var(--gold); color: #1a1a1a; }
  .btn-gold:hover { background: #f0d48a; }
  .btn-outline {
    background: rgba(255,255,255,0.06); color: var(--accent-soft);
    border: 1px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--accent-muted); color: var(--accent); background: rgba(255,255,255,0.1); }
  .btn-green-sm {
    background: var(--green-soft); color: var(--green);
    border: 1px solid rgba(110,231,160,0.25);
    padding: 5px 10px; font-size: 12px; font-weight: 600;
    border-radius: 6px; cursor: pointer; white-space: nowrap;
    font-family: 'Tajawal', sans-serif; transition: all var(--transition);
    width: auto;
  }
  .btn-green-sm:hover { background: rgba(110,231,160,0.25); }
  .btn-green-sm:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-sm {
    padding: 6px 14px; font-size: 12px; border-radius: 6px;
    width: auto; cursor: pointer; font-family: 'Tajawal', sans-serif;
    background: rgba(255,255,255,0.08); color: var(--accent-soft);
    border: 1px solid var(--border); transition: all var(--transition);
  }
  .btn-sm:hover { background: rgba(255,255,255,0.14); }
  .btn-save-slide {
    background: var(--gold); color: #1a1a1a;
    padding: 8px 20px; font-size: 13px; border-radius: 8px;
    cursor: pointer; font-family: 'Tajawal', sans-serif;
    font-weight: 600; border: none; transition: all var(--transition); width: auto;
  }
  .btn-save-slide:hover { background: #f0d48a; }

  /* ─── MAIN EDITOR ─── */
  .editor-main {
    padding: 40px 48px;
    max-width: 860px;
  }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 36px; padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap; gap: 12px;
  }
  .top-bar-title {
    font-size: 13px; color: var(--accent-muted); font-weight: 300;
  }
  .badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 3px 10px; border-radius: 20px;
    background: rgba(110,231,160,0.15); color: var(--green);
    font-family: 'DM Sans', sans-serif;
  }

  /* ─── SLIDE EDITOR HEADER ─── */
  .editor-header { margin-bottom: 28px; }
  .editor-slide-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 6px;
    font-family: 'DM Sans', sans-serif;
  }
  .editor-slide-title {
    font-family: 'DM Serif Display', serif;
    font-size: 26px; color: var(--accent); direction: ltr; text-align: right;
  }

  /* ─── FIELD GROUPS ─── */
  .field-group { margin-bottom: 22px; }
  .field-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .field-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent-muted);
    font-family: 'DM Sans', sans-serif;
  }

  textarea, input[type="text"] {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--accent);
    font-family: 'DM Sans', 'Tajawal', sans-serif;
    font-size: 14px; line-height: 1.6;
    resize: vertical; outline: none;
    transition: border-color var(--transition), background var(--transition);
    direction: ltr;
  }
  textarea:focus, input[type="text"]:focus {
    border-color: var(--border-focus);
    background: var(--bg-input-focus);
  }
  textarea { min-height: 72px; }

  /* ─── INLINE TRANSLATION OUTPUT ─── */
  .inline-trans {
    margin-top: 8px;
    background: rgba(232,201,122,0.07);
    border: 1px solid rgba(232,201,122,0.2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px; color: var(--accent-soft);
    line-height: 1.7; direction: auto;
    display: none;
  }
  .inline-trans.visible { display: block; }
  .inline-trans-header {
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--gold);
    margin-bottom: 6px; font-family: 'DM Sans', sans-serif;
  }
  .inline-trans-actions {
    display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;
  }

  /* ─── BULLETS SECTION ─── */
  .bullets-section { margin-bottom: 22px; }
  .bullet-row { margin-bottom: 14px; }
  .bullet-row-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
  }
  .bullet-index {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--gold); color: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; flex-shrink: 0;
    font-family: 'DM Sans', sans-serif;
  }
  .bullet-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent-muted);
    font-family: 'DM Sans', sans-serif; flex: 1;
  }

  /* ─── LANG SELECT ─── */
  .lang-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .lang-row label { font-size: 12px; color: var(--accent-muted); white-space: nowrap; }
  select {
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px; color: var(--accent);
    font-family: 'Tajawal', 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; outline: none;
    transition: border-color var(--transition);
  }
  select:focus { border-color: var(--border-focus); }

  /* ─── DIVIDER ─── */
  .hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

  /* ─── TOAST ─── */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--green); color: #1a1a1a;
    padding: 12px 28px; border-radius: 8px;
    font-size: 14px; font-weight: 700;
    opacity: 0; transition: all 300ms ease; pointer-events: none;
    z-index: 999; font-family: 'Tajawal', sans-serif;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ─── SPINNER ─── */
  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid rgba(110,231,160,0.3);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── PROGRESS BAR (top) ─── */
  .page-progress { position: fixed; top: 0; left: 0; right: 0; height: 2px; background: var(--gold); width: 0; z-index: 100; transition: width 400ms ease; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA0-xXIpLZ_hI9-EYgy7OjJDkqdaHXYYn4",
    authDomain: "shabih-3f90b.firebaseapp.com",
    projectId: "shabih-3f90b",
    storageBucket: "shabih-3f90b.firebasestorage.app",
    messagingSenderId: "596330748325",
    appId: "1:596330748325:web:be28a7751a0b38f5e3b04c"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.__db = db;

  window.__loadSlide = async function(idx) {
    try {
      const snap = await getDoc(doc(db, 'slides', String(idx)));
      return snap.exists() ? snap.data() : {};
    } catch(e) {
      console.error('Firestore load failed for slide', idx, e);
      window.__lastLoadError = e.message || String(e);
      return {};
    }
  };

  window.__saveSlide = async function(idx, data) {
    await setDoc(doc(db, 'slides', String(idx)), data);
  };
</script>

let currentSlide = 0;

// ─── BUILD SIDEBAR ───
function buildNav() {
  const nav = document.getElementById('slide-nav');
  nav.innerHTML = SLIDES.map((s,i) => `
    <div class="slide-nav-item ${i===currentSlide?'active':''}" onclick="goToSlide(${i})">
      <div class="slide-nav-num">${s.id}</div>
      <div class="slide-nav-label">${s.labelAr}</div>
    </div>`).join('');
  // Update progress
  const pct = ((currentSlide)/(SLIDES.length-1))*100;
  document.getElementById('page-progress').style.width = pct+'%';
}

// ─── BUILD EDITOR ───

    showToast('تعذّر تحميل بيانات هذه الشريحة من Firebase — تُعرض القيم الافتراضية');
  }
  const lang = document.getElementById('globalLang').value;

  const editor = document.getElementById('slide-editor');

  let html = `<div class="editor-header">
    <div class="editor-slide-label">الشريحة ${s.id} — ${s.labelAr}</div>
    <div class="editor-slide-title">${s.title}</div>
  </div>`;

  // Fields
  s.fields.forEach(f => {
    const val = stored[f.key] !== undefined ? stored[f.key] : f.default;
    const fid = `field_${f.key}`;
    const tid = `trans_${f.key}`;
    html += `<div class="field-group">
      <div class="field-header">
        <label class="field-label">${f.labelAr}</label>
        <button class="btn-green-sm" onclick="translateField('${fid}','${tid}')">ترجم</button>
      </div>
      ${f.type==='textarea'
        ? `<textarea id="${fid}" rows="3">${escHtml(val)}</textarea>`
        : `<input type="text" id="${fid}" value="${escHtml(val)}">`}
      <div class="inline-trans" id="${tid}">
        <div class="inline-trans-header">الترجمة</div>
        <div class="inline-trans-text"></div>
        <div class="inline-trans-actions">
          <button class="btn-sm" onclick="applyInlineTrans('${fid}','${tid}')">تطبيق</button>

        </div>
      </div>

  // Bullets
  if (s.bullets && s.bullets.length > 0) {
    html += `<hr class="hr"><div class="bullets-section"><label class="field-label" style="display:block;margin-bottom:14px">النقاط الرئيسية</label>`;
    s.bullets.forEach((b, i) => {
      const val = stored.bullets && stored.bullets[i] !== undefined ? stored.bullets[i] : b;
      const fid = `bullet_${i}`;
      const tid = `btrans_${i}`;
      html += `<div class="bullet-row">
        <div class="bullet-row-header">
          <div class="bullet-index">${i+1}</div>
          <div class="bullet-label">نقطة ${i+1}</div>
          <button class="btn-green-sm" onclick="translateField('${fid}','${tid}')">ترجم</button>
        </div>
        <textarea id="${fid}" rows="2">${escHtml(val)}</textarea>
        <div class="inline-trans" id="${tid}">
          <div class="inline-trans-header">الترجمة</div>
          <div class="inline-trans-text"></div>
          <div class="inline-trans-actions">
            <button class="btn-sm" onclick="applyInlineTrans('${fid}','${tid}')">تطبيق</button>
            <button class="btn-sm" onclick="copyInlineTrans('${tid}')">نسخ</button>
          </div>
        </div>
      </div>`;
    });

  if (s.isCompTable) {
    const cols = (stored.columns && stored.columns.length) ? stored.columns : DEFAULT_COMP_TABLE.columns;
    const rows = (stored.rows && stored.rows.length) ? stored.rows : DEFAULT_COMP_TABLE.rows;
    html += `<hr class="hr"><div class="bullets-section">
      <label class="field-label" style="display:block;margin-bottom:14px">أعمدة الجدول (المعايير)</label>
      <div id="ct-cols">`;
    cols.forEach((c, j) => {
      html += `<div class="field-group"><input type="text" class="ct-col-input" data-col="${j}" value="${escHtml(c)}"></div>`;

      <hr class="hr">
      <label class="field-label" style="display:block;margin-bottom:14px">صفوف الجدول (المنصات)</label>
      <div id="ct-rows"></div>
      <button type="button" class="btn-sm" onclick="addCompRow()">+ إضافة صف</button>

  editor.innerHTML = html;

  if (s.isCompTable) {

    const rows = (stored.rows && stored.rows.length) ? stored.rows : DEFAULT_COMP_TABLE.rows;

// Adds one editable row to the competitors table editor (name input + a check/cross toggle per column).
function addCompRow(name, values, container) {
  container = container || document.getElementById('ct-rows');
  const colInputs = document.querySelectorAll('.ct-col-input');
  const colCount = colInputs.length || DEFAULT_COMP_TABLE.columns.length;
  const vals = values && values.length === colCount ? values : new Array(colCount).fill(false);
  const row = document.createElement('div');
  row.className = 'ct-row-editor';
  row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--accent-faint);flex-wrap:wrap';
  let togglesHtml = '';
  for (let j = 0; j < colCount; j++) {
    const checked = vals[j] ? 'checked' : '';
    togglesHtml += `<label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--accent-muted)"><input type="checkbox" class="ct-val-input" data-col="${j}" ${checked}></label>`;
  }
  row.innerHTML = `<input type="text" class="ct-name-input" value="${escHtml(name || '')}" style="flex:1;min-width:140px">
    <div style="display:flex;gap:12px;flex-wrap:wrap">${togglesHtml}</div>
    <button type="button" class="btn-sm" onclick="this.closest('.ct-row-editor').remove()">حذف الصف</button>`;
  container.appendChild(row);
}
window.addCompRow = addCompRow;

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── TRANSLATE SINGLE FIELD ───
// NOTE: this used to call https://api.anthropic.com/v1/messages directly from the browser.
// That endpoint requires a server-side API key and does not allow browser CORS requests,
// so every translation attempt failed silently once this page was hosted outside the
// Claude sandbox. It's replaced below with MyMemory — a free, keyless, CORS-enabled
// open translation API (https://mymemory.translated.net) that works from any static page.
async function translateField(fieldId, transId) {
  const fieldEl = document.getElementById(fieldId);
  const transEl = document.getElementById(transId);
  if (!fieldEl || !transEl) return;

  const text = fieldEl.value.trim();
  if (!text) return;

  const targetLang = document.getElementById('globalLang').value;

  // Show loading
  const btn = transEl.closest('.field-group, .bullet-row')
    ? transEl.closest('.field-group, .bullet-row').querySelector('.btn-green-sm')
    : null;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  transEl.classList.add('visible');
  transEl.querySelector('.inline-trans-text').textContent = '...';

  try {
    const translated = await translateViaMyMemory(text, targetLang);
    transEl.querySelector('.inline-trans-text').textContent = translated;
    transEl.dataset.translation = translated;
  } catch(e) {
    transEl.querySelector('.inline-trans-text').textContent = 'تعذّرت الترجمة: ' + e.message;
  }

  if (btn) { btn.disabled = false; btn.textContent = 'ترجم'; }
}

// Detects Arabic vs. Latin script to pick a sensible source language automatically.
function detectSourceLang(text) {
  return /[\u0600-\u06FF]/.test(text) ? 'ar' : 'en';
}

// MyMemory limits each request to ~500 characters, so long fields are split on
// sentence boundaries and translated in sequence, then re-joined.
function splitIntoChunks(text, maxLen) {
  if (text.length <= maxLen) return [text];
  const sentences = text.match(/[^.!?]+[.!?]*\s*/g) || [text];
  const chunks = [];
  let cur = '';
  sentences.forEach(s => {
    if ((cur + s).length > maxLen && cur) { chunks.push(cur.trim()); cur = s; }
    else { cur += s; }
  });
  if (cur.trim()) chunks.push(cur.trim());
  return chunks;
}

async function translateViaMyMemory(text, targetLang) {
  const sourceLang = detectSourceLang(text);
  if (sourceLang === targetLang) return text;

  const chunks = splitIntoChunks(text, 480);
  const results = [];
  for (const chunk of chunks) {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=${sourceLang}|${targetLang}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('تعذّر الاتصال بمزود الترجمة');
    const data = await res.json();
    const translatedChunk = data && data.responseData && data.responseData.translatedText;
    if (!translatedChunk) throw new Error('لم يتم إرجاع ترجمة صالحة');
    results.push(translatedChunk);
  }
  return results.join(' ');
}

function applyInlineTrans(fieldId, transId) {
  const fieldEl = document.getElementById(fieldId);
  const transEl = document.getElementById(transId);
  if (!fieldEl || !transEl) return;
  const txt = transEl.dataset.translation || transEl.querySelector('.inline-trans-text').textContent;
  if (txt) { fieldEl.value = txt; showToast('تم التطبيق'); }
}

function copyInlineTrans(transId) {
  const transEl = document.getElementById(transId);
  if (!transEl) return;
  const txt = transEl.dataset.translation || transEl.querySelector('.inline-trans-text').textContent;
  if (txt) navigator.clipboard.writeText(txt).then(() => showToast('تم النسخ'));
}

// ─── SAVE ───
async function saveCurrentSlide() {
  const s = SLIDES[currentSlide];
  const data = {};
  s.fields.forEach(f => {
    const el = document.getElementById('field_' + f.key);
    if (el) data[f.key] = el.value;
  });
  if (s.bullets && s.bullets.length > 0) {
    data.bullets = s.bullets.map((_,i) => {
      const el = document.getElementById('bullet_' + i);
      return el ? el.value : s.bullets[i];
    });
  }
  if (s.isCompTable) {
    data.columns = Array.from(document.querySelectorAll('.ct-col-input')).map(el => el.value);
    data.rows = Array.from(document.querySelectorAll('.ct-row-editor')).map(rowEl => ({
      name: rowEl.querySelector('.ct-name-input').value,
      values: Array.from(rowEl.querySelectorAll('.ct-val-input')).map(cb => cb.checked)
    }));
  }
  try {
    await window.__saveSlide(currentSlide, data);
    showToast('تم الحفظ في Firebase');
  } catch(e) {
    console.error('Firestore save failed', e);
    showToast('فشل الحفظ: ' + (e.code || e.message || 'خطأ غير معروف'));
  }
}

// ─── NAVIGATION ───
async function goToSlide(idx) {
  currentSlide = idx;
  buildNav();
  document.getElementById('slide-editor').innerHTML = '<div style="color:var(--accent-muted);padding:40px;text-align:center">جارٍ التحميل...</div>';
  await buildEditor();
  document.querySelector('.editor-main').scrollTo(0,0);
}

async function navigateSlide(dir) {
  const next = currentSlide + dir;
  if (next < 0 || next >= SLIDES.length) return;
  await goToSlide(next);
}

// ─── TOAST ───
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ─── INIT ───
buildNav();
buildEditor();

// expose for onclick
window.goToSlide = goToSlide;
window.navigateSlide = navigateSlide;
window.saveCurrentSlide = saveCurrentSlide;
window.translateField = translateField;
window.applyInlineTrans = applyInlineTrans;
window.copyInlineTrans = copyInlineTrans;
